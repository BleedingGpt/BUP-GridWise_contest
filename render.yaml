services:
  - type: web
    name: gridwise-optimizer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: gpt-oss:120b-cloud
      - key: PYTHON_VERSION
        value: 3.12.0
